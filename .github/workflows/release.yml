name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Windows WPF Application
        shell: pwsh
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /t:winexe /o+ /platform:anycpu /nowarn:0618 /lib:"C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF" /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Web.Extensions.dll /r:System.Xaml.dll /r:WindowsBase.dll /r:PresentationCore.dll /r:PresentationFramework.dll /out:CodexMonitor-windows-x64.exe src\*.cs

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-Windows
          path: CodexMonitor-windows-x64.exe

  build-linux-amd64:
    name: Build Linux Binary (x86_64 / AMD64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux Build Headers
        run: |
          sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev

      - name: Compile Linux x86_64 Binary
        run: |
          cd linux
          go build -ldflags="-s -w" -o codex-monitor main.go
          chmod +x codex-monitor
          tar -czvf codex-monitor-linux-x86_64.tar.gz codex-monitor

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-Linux-amd64
          path: linux/codex-monitor-linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-amd64]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: CodexMonitor-Windows
          path: release-assets/

      - name: Download Linux AMD64 Binary
        uses: actions/download-artifact@v4
        with:
          name: CodexMonitor-Linux-amd64
          path: release-assets/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Codex Monitor ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 📦 Release Assets & Architecture Guide / 资产与系统架构说明

            | 资产文件名 (Asset) | 适用操作系统 (OS) | CPU 架构 (Architecture) | 说明 (Description) |
            | :--- | :--- | :--- | :--- |
            | **`CodexMonitor-windows-x64.exe`** | **Windows 10 / 11 / Server** | **x86_64 / x64 (64位)** | Windows 原生 GPU 加速桌面悬浮标 |
            | **`codex-monitor-linux-x86_64.tar.gz`** | **Linux (Ubuntu/Debian/Arch/Fedora)** | **x86_64 / AMD64 (64位)** | Linux 状态栏托盘与终端一体化独立程序 |

            #### 🚀 Quick Start / 快速开始
            - **Windows**: 下载 `CodexMonitor-windows-x64.exe` 双击直接运行。
            - **Linux**: 下载 `codex-monitor-linux-x86_64.tar.gz` 解压后运行 `./codex-monitor -d`。
          files: |
            release-assets/CodexMonitor-windows-x64.exe
            release-assets/codex-monitor-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
